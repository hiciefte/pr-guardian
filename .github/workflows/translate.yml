name: Translate

on:
  push:
    branches:
      - localize/pr-guardian-integration
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check OpenAI connectivity
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY repository secret is unset."
            exit 1
          fi

          response_file="$(mktemp)"
          status="$(curl -sS --connect-timeout 10 --max-time 30 \
            -o "$response_file" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            https://api.openai.com/v1/models)"
          if [ "$status" != "200" ]; then
            echo "::error::OpenAI connectivity check failed with HTTP ${status}."
            head -c 400 "$response_file"
            echo
            exit 1
          fi
          echo "OpenAI connectivity OK (HTTP ${status})."

      - uses: bisq-network/localize-pipeline@v0.1.0
        with:
          config-file: config.yaml
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          review-model: gpt-4o-mini
          process-all-files: true
          dry-run: false
          pr-branch: localize/pr-guardian-ai-translations
          pr-title: "Update PR Guardian translations"
          commit-message: "Update PR Guardian translations"
